<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fix Verification</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .job { background: #e3f2fd; padding: 8px; margin: 5px 0; border-radius: 3px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎉 Final Fix Verification</h1>
    <p>Testing that the frontend now shows REAL database jobs instead of mock jobs</p>
    
    <button onclick="testRealJobs()">Test Real Database Jobs</button>
    <button onclick="testStats()">Test Database Stats</button>
    <button onclick="testCompanies()">Test Real Companies</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        function addResult(message, isSuccess = true) {
            const div = document.createElement('div');
            div.className = `result ${isSuccess ? 'success' : 'error'}`;
            div.innerHTML = message;
            document.getElementById('results').appendChild(div);
        }
        
        function addJob(job) {
            const div = document.createElement('div');
            div.className = 'job';
            div.innerHTML = `
                <strong>${job.title}</strong> at <strong>${job.company}</strong><br>
                📍 ${job.location} | 💰 ${job.salary_text || 'Not specified'}<br>
                🔗 <a href="${job.apply_link}" target="_blank">${job.apply_link}</a><br>
                📊 Source: ${job.source} | Skills: ${job.skills ? job.skills.slice(0, 3).join(', ') : 'N/A'}
            `;
            document.getElementById('results').appendChild(div);
        }
        
        async function testRealJobs() {
            try {
                addResult('🔍 Testing real database jobs...');
                
                const response = await fetch(`${API_BASE}/jobs/search?limit=5`);
                const jobs = await response.json();
                
                if (response.ok && Array.isArray(jobs)) {
                    addResult(`✅ SUCCESS: Found ${jobs.length} real jobs from database!`);
                    
                    // Check for real companies (not mock ones)
                    const realCompanies = ['Google', 'Microsoft', 'Amazon', 'Meta', 'PhonePe'];
                    const foundRealCompanies = jobs.filter(job => 
                        realCompanies.some(company => job.company.includes(company))
                    );
                    
                    if (foundRealCompanies.length > 0) {
                        addResult(`🎯 VERIFIED: Found ${foundRealCompanies.length} jobs from real companies!`);
                    } else {
                        addResult('⚠️ WARNING: No jobs from major companies found', false);
                    }
                    
                    // Display sample jobs
                    addResult('📋 Sample jobs from database:');
                    jobs.forEach(job => addJob(job));
                    
                } else {
                    addResult(`❌ FAILED: API returned ${response.status}`, false);
                }
            } catch (error) {
                addResult(`❌ ERROR: ${error.message}`, false);
            }
        }
        
        async function testStats() {
            try {
                addResult('📊 Testing database statistics...');
                
                const response = await fetch(`${API_BASE}/v2/resume/stats`);
                const stats = await response.json();
                
                if (response.ok) {
                    addResult(`✅ Database Stats: ${stats.total_jobs} total jobs, ${stats.active_jobs} active`);
                    addResult(`📈 Sources: ${Object.keys(stats.jobs_by_source).join(', ')}`);
                    
                    // Verify we have quality sources
                    const qualitySources = ['google', 'microsoft', 'amazon', 'meta'];
                    const foundSources = qualitySources.filter(source => stats.jobs_by_source[source] > 0);
                    
                    if (foundSources.length >= 3) {
                        addResult(`🎯 VERIFIED: Found jobs from quality sources: ${foundSources.join(', ')}`);
                    } else {
                        addResult('⚠️ WARNING: Limited quality sources found', false);
                    }
                } else {
                    addResult(`❌ Stats API failed: ${response.status}`, false);
                }
            } catch (error) {
                addResult(`❌ Stats ERROR: ${error.message}`, false);
            }
        }
        
        async function testCompanies() {
            try {
                addResult('🏢 Testing for real company jobs...');
                
                const companies = ['Google', 'Microsoft', 'Amazon', 'Meta'];
                let totalFound = 0;
                
                for (const company of companies) {
                    const response = await fetch(`${API_BASE}/jobs/search?company=${company}&limit=3`);
                    const jobs = await response.json();
                    
                    if (response.ok && Array.isArray(jobs) && jobs.length > 0) {
                        totalFound += jobs.length;
                        addResult(`✅ ${company}: Found ${jobs.length} jobs`);
                        
                        // Show one sample job
                        if (jobs[0]) {
                            addJob(jobs[0]);
                        }
                    } else {
                        addResult(`⚠️ ${company}: No jobs found`);
                    }
                }
                
                if (totalFound > 0) {
                    addResult(`🎉 SUCCESS: Found ${totalFound} jobs from major companies!`);
                } else {
                    addResult('❌ FAILED: No jobs from major companies found', false);
                }
                
            } catch (error) {
                addResult(`❌ Company test ERROR: ${error.message}`, false);
            }
        }
        
        // Auto-run tests
        window.onload = function() {
            addResult('🚀 Starting verification tests...');
            setTimeout(testRealJobs, 1000);
            setTimeout(testStats, 3000);
            setTimeout(testCompanies, 5000);
        };
    </script>
</body>
</html>
